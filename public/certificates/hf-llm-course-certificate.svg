  <text x="230" y="776" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1f3d2b">Hugging Face</text>
  <text x="230" y="794" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3d2b">Instructors</text>

  <!-- Center medallion -->
  <circle cx="600" cy="700" r="46" fill="#f2c94c"/>
  <circle cx="600" cy="700" r="46" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="600" cy="700" r="40" fill="none" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="716" text-anchor="middle" font-size="40">🤗</text>

  <!-- Date -->
  <line x1="884" y1="690" x2="1040" y2="690" stroke="#1f3d2b" stroke-width="1.6"/>
  <text x="962" y="682" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f3d2b">2026-07-06</text>
  <text x="962" y="776" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1f3d2b">Date</text>
