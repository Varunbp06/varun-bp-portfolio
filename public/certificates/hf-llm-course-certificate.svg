    <circle cx="0" cy="0" r="46" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="41" cy="0" r="1.7" fill="#fff"/>
    <circle cx="35.5" cy="20.5" r="1.7" fill="#fff"/>
    <circle cx="20.5" cy="35.5" r="1.7" fill="#fff"/>
    <circle cx="0" cy="41" r="1.7" fill="#fff"/>
    <circle cx="-20.5" cy="35.5" r="1.7" fill="#fff"/>
    <circle cx="-35.5" cy="20.5" r="1.7" fill="#fff"/>
    <circle cx="-41" cy="0" r="1.7" fill="#fff"/>
    <circle cx="-35.5" cy="-20.5" r="1.7" fill="#fff"/>
    <circle cx="-20.5" cy="-35.5" r="1.7" fill="#fff"/>
    <circle cx="0" cy="-41" r="1.7" fill="#fff"/>
    <circle cx="20.5" cy="-35.5" r="1.7" fill="#fff"/>
    <circle cx="35.5" cy="-20.5" r="1.7" fill="#fff"/>
    <circle cx="0" cy="0" r="34" fill="url(#hf-asset-seal)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#3a3f44" stroke-width="1"/>
    <text x="0" y="-6" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e5b16">The LLM</text>
    <text x="0" y="10" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e5b16">Course</text>
